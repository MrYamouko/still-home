<style>
:root{--bg:#f3f8fc;--card:#fff;--field:#f6fafd;--text:#0b2540;--muted:#64809a;--brand:#2b9ce3;--brand-d:#1779b8;--navy:#0b2a4a;--soft:#e6f3fc;--line:#dce9f3;--ok:#16a06a;--bad:#d2493f;--sh:0 10px 30px rgba(11,42,74,.10);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08141f;--card:#0f2234;--field:#132a3f;--text:#e9f4fc;--muted:#8fa9bf;--brand:#4db3f0;--brand-d:#86cdf7;--soft:#15324b;--line:#1f3c55;--sh:0 10px 30px rgba(0,0,0,.45);color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15.5px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header b{font-size:19px;letter-spacing:.2px}header small{display:block;opacity:.75;font-size:11.5px;letter-spacing:.3px}
#lo{margin-left:auto;display:none;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:12px;font-weight:600;outline:0}

h2{font-size:22px;letter-spacing:-.4px;margin:6px 0 4px}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:26px;padding:26px 22px 74px;background:linear-gradient(135deg,#0b2a4a 0%,#1779b8 62%,#4db3f0 100%)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.hero::before{width:220px;height:220px;right:-70px;top:-80px}.hero::after{width:140px;height:140px;right:50px;bottom:-70px}
.hero h1{margin:0;font-size:27px;line-height:1.15;letter-spacing:-.6px;position:relative}.hero p{margin:8px 0 0;opacity:.85;font-size:14px;position:relative}

.seg{grid-column:1/-1;display:flex;background:var(--soft);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:10px 4px;border-radius:11px;font:inherit;font-size:13.5px;font-weight:700;outline:0}
.seg button.on{background:var(--card);color:var(--brand-d);box-shadow:0 2px 8px rgba(11,42,74,.14)}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--field);color:var(--text);font:inherit;outline:0;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px;letter-spacing:.2px}
form{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:4px 18px 20px;box-shadow:var(--sh)}
.card{background:var(--card);border-radius:24px;overflow:hidden;margin-bottom:18px;box-shadow:var(--sh);border:1px solid var(--line);animation:up .4s both}
.m{height:230px;background:var(--soft);position:relative;overflow:hidden}.m img,.m video{width:100%;height:100%;object-fit:cover;display:block}
.m::after{content:"";position:absolute;inset:auto 0 0;height:90px;background:linear-gradient(transparent,rgba(5,20,35,.7));pointer-events:none}
.pc{position:absolute;left:14px;bottom:12px;z-index:1;color:#fff;font-weight:800;font-size:20px;letter-spacing:-.3px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.ph{height:100%;display:flex;align-items:center;justify-content:center;font-size:54px;background:linear-gradient(135deg,hsl(var(--h) 80% 90%),hsl(var(--h) 70% 74%))}
.tag{position:absolute;left:12px;top:12px;z-index:1;background:rgba(255,255,255,.94);color:#1779b8;font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:999px;letter-spacing:.2px}.tag.v{left:auto;right:12px;background:rgba(11,42,74,.88);color:#fff}
.b{padding:15px 18px 18px}.b h3{margin:0 0 4px;font-size:18px;letter-spacing:-.3px;line-height:1.25}
.pr{color:var(--brand-d);font-weight:800}.mu{color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips span{background:var(--soft);color:var(--brand-d);font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px}
.pbox{background:var(--soft);border-radius:18px;padding:12px 16px;margin:14px 0;display:grid;gap:2px;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:700;background:linear-gradient(135deg,#2b9ce3,#1779b8);color:#fff;text-decoration:none;cursor:pointer;outline:0;box-shadow:0 6px 16px rgba(23,121,184,.3)}
.btn:active{filter:brightness(.92)}.btn:disabled{opacity:.6}
.btn.g{background:var(--soft);color:var(--brand-d);box-shadow:none}.btn.w{background:linear-gradient(135deg,#2fc15f,#1f9a4a);box-shadow:0 6px 16px rgba(31,154,74,.3)}.btn.r{background:var(--bad);box-shadow:none}
.row{display:flex;gap:8px;margin-top:12px}.row>*{flex:1}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;z-index:9;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 30px rgba(11,42,74,.22);display:flex;padding:6px}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 0;font:inherit;font-size:11.5px;font-weight:700;border-radius:18px;outline:0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}nav button.on{color:#fff;background:linear-gradient(135deg,#2b9ce3,#1779b8)}
.ov{position:fixed;inset:0;background:rgba(4,16,28,.65);backdrop-filter:blur(3px);z-index:20;display:none;align-items:flex-end;justify-content:center}.ov.on{display:flex}
.sh{background:var(--card);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:28px 28px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:up .3s both}
.sh::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:var(--line);margin:9px auto}
.sh .m{height:auto;overflow:visible}.sh .m::after{display:none}.sh .m>.ph{height:230px}
.x{position:absolute;right:12px;top:12px;z-index:3;background:rgba(255,255,255,.95);color:#0b2540;border:0;width:36px;height:36px;border-radius:50%;font-size:16px;outline:0}
.gw{position:relative;background:#0b1620}.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:min(70vh,560px)}
.gal>img,.gal>video,.gal>iframe,.gal>.ph{flex:0 0 100%;width:100%;height:100%;object-fit:contain;scroll-snap-align:center;border:0;background:#0b1620}.gal>.ph{background:var(--soft)}
.cnt{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.st{font-size:12px;font-weight:800;padding:4px 11px;border-radius:999px;background:var(--soft)}.st.ok{color:var(--ok)}.st.off{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;z-index:30;display:none;max-width:90%;text-align:center;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.empty{text-align:center;color:var(--muted);padding:50px 10px}.note{font-size:12px;color:var(--muted);margin-top:6px}
#prev{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.pre{flex:0 0 auto!important;padding:13px 14px;background:var(--soft);border-radius:14px;font-weight:800;color:var(--brand-d)}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#sp{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:radial-gradient(circle at 30% 20%,#1779b8,#0b2a4a 70%);color:#fff;animation:sp .6s 1.6s forwards;pointer-events:none}
#sp b{font-size:32px;letter-spacing:-.5px;animation:up .8s .5s both}#sp small{opacity:.8;animation:up .8s .8s both}
#sp path{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1s ease forwards}#sp path:nth-of-type(2){animation-delay:.25s}#sp path:nth-of-type(3){animation-delay:.5s}
#sp circle{opacity:.5;animation:pl 1s ease-in-out infinite alternate}
.hero{background-size:200% 200%;animation:bg 9s ease infinite alternate}
.hero::before{animation:fl 7s ease-in-out infinite alternate}.hero::after{animation:fl 9s ease-in-out infinite alternate-reverse}
.hero h1{font-size:30px;background:linear-gradient(90deg,#fff 20%,#a8dcff 50%,#fff 80%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:bg 5s linear infinite alternate}
.filters{border:1.5px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,#38aaf0,#7c6cf0,#38d4e8) border-box}
.card{transition:transform .2s}.card:active{transform:scale(.98)}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}.card:nth-child(4){animation-delay:.24s}.card:nth-child(n+5){animation-delay:.3s}
.pc{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(10px);padding:6px 13px;border-radius:14px}
.tag{backdrop-filter:blur(8px)}
nav button.on{box-shadow:0 8px 22px rgba(43,156,227,.55)}
header svg circle{animation:pl 2.4s ease-in-out infinite alternate}
.btn:not(.g):not(.r):not(.w){background-image:linear-gradient(120deg,#2b9ce3,#1779b8,#5a7df0);background-size:200% 200%;animation:bg 6s ease infinite alternate}
@keyframes bg{to{background-position:100% 50%}}@keyframes fl{to{transform:translate(-26px,18px) scale(1.18)}}
@keyframes pl{from{fill-opacity:.15}to{fill-opacity:.7}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes sp{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion:reduce){#sp{display:none}}
.hero{padding:16px 18px 52px;border-radius:22px}
.hero h1{font-size:22px}.hero p{font-size:13px;margin-top:4px}
.hero::before{width:150px;height:150px;right:-50px;top:-60px}.hero::after{width:90px;height:90px;right:40px;bottom:-45px}
.filters{margin:-36px 10px 16px}
.m{height:196px}
.chips{gap:6px;align-items:center}.chips span{display:inline-flex;align-items:center;height:28px;padding:0 12px;line-height:1;white-space:nowrap}
.chips span:first-child{background:var(--navy);color:#fff}
input,select{text-overflow:ellipsis}input::placeholder{font-size:14.5px}
</style>

<script>
const sb=supabase.createClient("https://gubfawtcnqiuafdkwreo.supabase.co","sb_publishable_U5lbT5paxiKEfDKjzmtL_g_r4M3zAio");
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n).toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g," ")+" FCFA";
const tel=x=>String(x.tel||"").replace(/\D/g,"");
let ready=false,EDIT=null,PH=[],L=[],M=[],user=null,tab=(["pub","mine"].indexOf(location.hash.slice(1))>=0?location.hash.slice(1):"home"),f={type:"all",q:"",max:"",per:"mois"},pend=null,state="load";
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2800)}
function go(t){tab=t;pend=null;EDIT=null;if(location.hash.slice(1)!==t)location.hash=t;render();window.scrollTo(0,0);if(t==="mine"&&user)loadMine()}
const cover=x=>x.thumb_url||(x.photos&&x.photos[0])||(x.media_type==="image"?x.media_url:null);
const media=x=>{const c=cover(x);return c?`<img src="${esc(c)}" alt="" loading="lazy">`:`<div class="ph" style="--h:${190+(x.chambres||1)*8}">${x.type==="meuble"?"🛋️":"🏠"}</div>`};
function vid(u){const y=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/))([\w-]{11})/);if(y)return `<iframe src="https://www.youtube-nocookie.com/embed/${y[1]}" allowfullscreen loading="lazy" style="border:0"></iframe>`;if(/^https:\/\/(www\.|m\.|vm\.|vt\.)?(youtube\.com|youtu\.be|tiktok\.com)\//i.test(u))return `<div class="ph" style="--h:205"><a class="btn" target="_blank" rel="noopener" href="${esc(u)}">▶ Voir la vidéo</a></div>`;return `<video src="${esc(u)}#t=0.1" controls playsinline preload="metadata"></video>`}
const gal=x=>{const p=x.photos&&x.photos.length?x.photos:(x.media_type==="image"&&x.media_url?[x.media_url]:[]),v=x.video_url||(x.media_type==="video"?x.media_url:null),n=p.length+(v?1:0);return n?`<div class="gw"><div class="gal" onscroll="cn(this)">${v?vid(v):""}${p.map(u=>`<img src="${esc(u)}" alt="">`).join("")}</div>${n>1?`<span class="cnt">1/${n}</span>`:""}</div>`:media(x)};
function cn(g){const c=g.nextElementSibling;if(c)c.textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+"/"+g.children.length}
const prx=x=>[x.prix_jour&&fmt(x.prix_jour)+" / jour",x.prix_semaine&&fmt(x.prix_semaine)+" / semaine",(x.prix_mois||(!x.prix_jour&&!x.prix_semaine&&x.prix))&&fmt(x.prix_mois||x.prix)+" / mois"].filter(Boolean);
const lg=x=>x.logement==="cs"?`Chambre-salon · ${x.chambres} ch. · ${x.salons} salon${x.salons>1?"s":""}`:"Studio";
const wm=x=>`Bonjour,\n\nJe vous contacte depuis l’application Still Home à propos de votre annonce « ${x.titre} » (${x.quartier}), proposée à ${prx(x)[0]}.\n\nCette annonce est-elle toujours disponible ? Pourriez-vous me communiquer plus de détails et me proposer un créneau pour une visite ?\n\nJe vous remercie par avance.\nCordialement.`;
const chipsOf=x=>x.logement==="cs"?["Chambre-salon",x.chambres+" chambre"+(x.chambres>1?"s":""),x.salons+" salon"+(x.salons>1?"s":"")]:["Studio"];
const pin='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const tagT=x=>x.type==="meuble"?"Meublé":"Non meublé";
function card(x,extra){const np=(x.photos||[]).length;return `<article class="card" onclick="openD('${x.id}')"><div class="m">${media(x)}<span class="tag">${tagT(x)}</span>${x.video_url||x.media_type==="video"?'<span class="tag v">Vidéo</span>':""}<div class="pc">${prx(x)[0]}</div></div><div class="b"><h3>${esc(x.titre)}</h3><div class="mu">${pin} ${esc(x.quartier)}</div><div class="chips">${chipsOf(x).map(c=>`<span>${c}</span>`).join("")}${np>1?`<span>${np} photos</span>`:""}</div>${extra||""}</div></article>`}
function quartiers(){const s=new Set(["Cadjehoun","Fidjrossè","Haie Vive","Akpakpa","Agla","Godomey","Ganhi","Ladji","Vèdoko"]);L.forEach(x=>s.add(x.quartier));return[...s].sort()}
const dl=()=>`<datalist id="qs">${quartiers().map(q=>`<option value="${esc(q)}">`).join("")}</datalist>`;
function home(){return `<div class="hero"><h1>Trouvez votre chez-vous</h1><p>Meublés ou non, trouvez le lieu qui vous ressemble.</p></div><div class="filters"><div class="seg">${[["all","Tous"],["meuble","Meublés"],["non","Non meublés"]].map(a=>`<button class="${f.type===a[0]?"on":""}" onclick="f.type='${a[0]}';render()">${a[1]}</button>`).join("")}</div><input style="grid-column:1/-1" list="qs" placeholder="Quartier ou ville…" value="${esc(f.q)}" oninput="f.q=this.value;renderList()"><select onchange="f.per=this.value;renderList()">${[["mois","Par mois"],["semaine","Par semaine"],["jour","Par jour"]].map(a=>`<option value="${a[0]}" ${f.per===a[0]?"selected":""}>${a[1]}</option>`).join("")}</select><input type="number" inputmode="numeric" placeholder="Prix max (FCFA)" value="${esc(f.max)}" oninput="f.max=this.value;renderList()">${dl()}</div><div id="list"></div>`}
function renderList(){const e=$("#list");if(!e)return;if(state==="load"&&!L.length){e.innerHTML='<div class="empty">Chargement…</div>';return}if(state==="err"&&!L.length){e.innerHTML='<div class="empty">Connexion lente ou coupée.<div class="row"><button class="btn" onclick="load()">Réessayer</button></div></div>';return}const k={jour:"prix_jour",semaine:"prix_semaine",mois:"prix_mois"}[f.per],pv=x=>x[k]||(f.per==="mois"&&!x.prix_jour&&!x.prix_semaine?x.prix:null);const r=L.filter(x=>(f.type==="all"||x.type===f.type)&&(!f.q||x.quartier.toLowerCase().includes(f.q.toLowerCase()))&&(!f.max||(pv(x)!=null&&pv(x)<=+f.max)));e.innerHTML=r.length?r.map(x=>card(x)).join(""):'<div class="empty">Aucune annonce ne correspond.</div>'}
async function load(){state="load";renderList();const r=await sb.from("annonces").select("*").eq("dispo",true).order("created_at",{ascending:false}).limit(60);if(r.error)state="err";else{L=r.data;state="ok"}renderList()}
async function loadMine(){const r=await sb.from("annonces").select("*").eq("user_id",user.id).order("created_at",{ascending:false});if(r.error)return toast("Impossible de charger vos annonces");M=r.data;if(tab==="mine")render()}
function auth(t){return `<h2 style="margin:4px 0">${t}</h2><form onsubmit="doAuth(event)"><label>E-mail</label><input name="e" type="email" required autocomplete="email"><label>Mot de passe (6 caractères minimum)</label><input name="p" type="password" required minlength="6" autocomplete="current-password"><div class="row"><button class="btn" type="submit" value="in">Se connecter</button><button class="btn g" type="submit" value="up">Créer un compte</button></div></form>`}
async function doAuth(e){e.preventDefault();const d=new FormData(e.target),up=e.submitter&&e.submitter.value==="up",c={email:d.get("e").trim(),password:d.get("p")};const r=up?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);if(r.error)return toast(r.error.message);if(!r.data.session)return toast("Vérifiez votre e-mail pour confirmer votre compte");user=r.data.user;toast("Connecté ✓");render();if(tab==="mine")loadMine()}
async function logout(){await sb.auth.signOut();user=null;M=[];toast("Déconnecté");render()}
function pub(){if(!ready)return '<div class="empty">Chargement…</div>';if(!user)return auth("Connectez-vous pour publier");const x=EDIT||{},v=(k,d)=>esc(x[k]==null?(d==null?"":d):x[k]),sel=(k,b)=>x[k]===b?"selected":"";PH=[];return `<h2 style="margin:4px 0">${EDIT?"Modifier l’annonce":"Publier une annonce"}</h2><form name="fm" onsubmit="submitP(event)"><label>Titre</label><input name="titre" required maxlength="80" value="${v("titre")}" placeholder="Ex : Studio meublé climatisé"><label>Type</label><select name="type" onchange="fx()"><option value="meuble">Meublé</option><option value="non" ${sel("type","non")}>Non meublé</option></select><label>Logement</label><select name="logement" onchange="fx()"><option value="studio">Studio</option><option value="cs" ${sel("logement","cs")}>Chambre-salon</option></select><div id="ch" class="row"><div><label>Nombre de chambres</label><input name="chambres" type="number" inputmode="numeric" min="1" value="${esc(x.chambres||1)}"></div><div><label>Nombre de salons</label><input name="salons" type="number" inputmode="numeric" min="1" value="${esc(x.salons||1)}"></div></div><div id="pj"><label>Prix par jour (FCFA)</label><input name="prix_jour" type="number" inputmode="numeric" min="1" value="${v("prix_jour")}"></div><div id="ps"><label>Prix par semaine (FCFA)</label><input name="prix_semaine" type="number" inputmode="numeric" min="1" value="${v("prix_semaine")}"></div><div id="pm"><label>Prix par mois (FCFA)</label><input name="prix_mois" type="number" inputmode="numeric" min="1" value="${v("prix_mois")}"></div><label>Quartier</label><input name="quartier" list="qs" required value="${v("quartier")}" placeholder="Ex : Cadjehoun">${dl()}<label>Description</label><textarea name="desc" rows="8" maxlength="3000" placeholder="Détails du bien, équipements, conditions…">${v("description")}</textarea><label>Vous êtes</label><select name="role"><option>Propriétaire</option><option ${sel("role","Démarcheur")}>Démarcheur</option></select><label>Téléphone / WhatsApp</label><div class="row" style="align-items:center"><span class="pre">+229</span><input name="tel" type="tel" inputmode="tel" required value="${esc(String(x.tel||"").replace(/^229/,""))}" placeholder="0197000000"></div><div class="note">Numéro à 10 chiffres, sans l’indicatif (déjà ajouté).</div>${EDIT?'<div class="note">Les photos et la vidéo ne peuvent pas encore être modifiées ici.</div>':'<label>Photos (10 maximum)</label><input type="file" accept="image/*" multiple onchange="addPh(this)"><div id="prev"></div><label>Vidéo (1 maximum, 30 Mo)</label><input name="vid" type="file" accept="video/*"><label>Ou lien d’une vidéo YouTube / TikTok</label><input name="vlink" type="url" placeholder="https://…"><div class="note">Les photos sont réduites automatiquement pour rester légères.</div>'}<div class="row"><button class="btn" type="submit">${EDIT?"Enregistrer":"Publier"}</button></div></form>`}
function fx(){const F=document.forms.fm,m=F.type.value==="meuble",c=F.logement.value==="cs";[["ch",c],["pj",m],["ps",m]].forEach(a=>{const d=$("#"+a[0]);d.style.display=a[1]?"":"none";d.querySelectorAll("input").forEach(n=>n.disabled=!a[1])});F.prix_mois.required=!m}
function addPh(i){for(const f of i.files){if(PH.length<10)PH.push(f);else{toast("10 photos maximum");break}}i.value="";prev()}
function prev(){$("#prev").innerHTML=PH.map((f,k)=>`<div style="position:relative"><img src="${URL.createObjectURL(f)}" alt="" style="width:100%;height:80px;object-fit:cover;border-radius:10px"><button type="button" class="x" style="width:24px;height:24px;font-size:13px;right:4px;top:4px" onclick="PH.splice(${k},1);prev()">✕</button></div>`).join("")}
function shrink(file,mx){return new Promise((ok,ko)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):ko(new Error("Image illisible")),"image/jpeg",.75)};i.onerror=()=>ko(new Error("Image illisible"));i.src=URL.createObjectURL(file)})}
async function submitP(e){e.preventDefault();const F=e.target,b=e.submitter||F.querySelector("button[type=submit]"),g=n=>F[n].value.trim(),num=n=>F[n]&&F[n].value?+F[n].value:null,m=g("type")==="meuble",cs=g("logement")==="cs";let t=g("tel").replace(/\D/g,"");if(/^00229/.test(t))t=t.slice(5);else if(/^229/.test(t)&&t.length>10)t=t.slice(3);if(t.length!==8&&t.length!==10)return toast("Numéro invalide : 10 chiffres après +229 (ex : 0197000000)");const pj=m?num("prix_jour"):null,ps=m?num("prix_semaine"):null,pm=num("prix_mois");if(!pj&&!ps&&!pm)return toast("Indiquez au moins un prix");const ch=cs?+g("chambres"):0,sa=cs?+g("salons"):0,row={titre:g("titre"),type:g("type"),logement:g("logement"),chambres:ch,salons:sa,pieces:cs?ch+sa:1,prix_jour:pj,prix_semaine:ps,prix_mois:pm,prix:pm||(ps?ps*4:pj*30),quartier:g("quartier"),description:g("desc"),role:g("role"),tel:"229"+t};b.disabled=true;try{if(EDIT){const r=await sb.from("annonces").update(row).eq("id",EDIT.id).select("id");if(r.error)throw r.error;if(!r.data||!r.data.length)throw new Error("Modification refusée. Reconnectez-vous puis réessayez.");EDIT=null;toast("Annonce modifiée ✓")}else{const vd=F.vid&&F.vid.files[0];if(vd&&vd.size>31457280)throw new Error("Vidéo trop lourde (30 Mo max)");const up=async(blob,ext,ct)=>{const p=`${user.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`,u=await sb.storage.from("medias").upload(p,blob,{contentType:ct,cacheControl:"31536000"});if(u.error)throw u.error;return sb.storage.from("medias").getPublicUrl(p).data.publicUrl};row.photos=[];let k=0;for(const f of PH){b.textContent=`Envoi photo ${++k}/${PH.length}…`;row.photos.push(await up(await shrink(f,1280),"jpg","image/jpeg"))}if(PH.length)row.thumb_url=await up(await shrink(PH[0],480),"jpg","image/jpeg");if(vd){b.textContent="Envoi de la vidéo…";row.video_url=await up(vd,(vd.name.split(".").pop()||"mp4").toLowerCase(),vd.type)}const lk=F.vlink.value.trim();if(!vd&&lk){if(!/^https:\/\/(www\.|m\.|vm\.|vt\.)?(youtube\.com|youtu\.be|tiktok\.com)\//i.test(lk))throw new Error("Lien non reconnu : utilisez un lien YouTube ou TikTok");row.video_url=lk}const r=await sb.from("annonces").insert(row);if(r.error)throw r.error;toast("Annonce publiée ✓")}go("mine");load()}catch(err){toast(err.message||"Erreur, réessayez");b.disabled=false;b.textContent=EDIT?"Enregistrer":"Publier"}}
function mine(){if(!ready)return '<div class="empty">Chargement…</div>';if(!user)return auth("Connectez-vous pour voir vos annonces");return `<h2 style="margin:4px 0">Mes annonces</h2>`+(M.length?M.map(x=>card(x,`<div style="margin-top:8px"><span class="st ${x.dispo?"ok":"off"}">${x.dispo?"● En ligne":"● Hors marché"}</span></div><div class="row"><button class="btn g" onclick="event.stopPropagation();edit('${x.id}')">✏️ Modifier</button><button class="btn g" onclick="event.stopPropagation();tg('${x.id}')">${x.dispo?"Hors marché":"Remettre en ligne"}</button><button class="btn ${pend===x.id?"r":"g"}" onclick="event.stopPropagation();del('${x.id}')">${pend===x.id?"Confirmer ?":"Supprimer"}</button></div>`)).join(""):'<div class="empty">Vous n’avez pas encore publié d’annonce.</div>')}
function edit(id){EDIT=M.find(a=>a.id===id);tab="pub";render();window.scrollTo(0,0)}
async function tg(id){const x=M.find(a=>a.id===id),r=await sb.from("annonces").update({dispo:!x.dispo}).eq("id",id);if(r.error)return toast("Échec, réessayez");x.dispo=!x.dispo;toast(x.dispo?"Annonce remise en ligne":"Annonce hors marché");render();load()}
async function del(id){if(pend!==id){pend=id;return render()}const x=M.find(a=>a.id===id),r=await sb.from("annonces").delete().eq("id",id);pend=null;if(r.error)return toast("Échec, réessayez");const ps=[x.media_url,x.thumb_url,x.video_url].concat(x.photos||[]).filter(Boolean).map(u=>u.split("/medias/")[1]).filter(Boolean).map(decodeURIComponent);if(ps.length)sb.storage.from("medias").remove(ps);M=M.filter(a=>a.id!==id);toast("Annonce supprimée");render();load()}
function openD(id){const x=[...M,...L].find(a=>a.id===id);if(!x)return;$("#sh").innerHTML=`<div class="m">${gal(x)}<button class="x" onclick="closeD()">✕</button><span class="tag">${tagT(x)}</span></div><div class="b"><h3 style="font-size:22px">${esc(x.titre)}</h3><div class="mu">${pin} ${esc(x.quartier)}</div><div class="chips">${chipsOf(x).map(c=>`<span>${c}</span>`).join("")}</div><div class="pbox">${prx(x).map(p=>`<div class="pr">${p}</div>`).join("")}</div><p style="white-space:pre-line;margin:12px 0">${esc(x.description)||"Aucune description."}</p><div class="mu">Contact : <b>${esc(x.role)}</b></div><div class="row"><a class="btn" href="tel:+${tel(x)}">📞 Appeler</a><a class="btn w" target="_blank" rel="noopener" href="https://wa.me/${tel(x)}?text=${encodeURIComponent(wm(x))}">WhatsApp</a></div></div>`;$("#ov").classList.add("on")}
function closeD(){$("#ov").classList.remove("on");$("#sh").innerHTML=""}
function render(){$("#v").innerHTML=tab==="home"?home():tab==="pub"?pub():mine();["home","pub","mine"].forEach(t=>$("#n-"+t).classList.toggle("on",t===tab));if(tab==="home")renderList();if(tab==="pub"&&user)fx();$("#lo").style.display=user?"block":"none"}
render();load();
sb.auth.getSession().then(r=>{user=r.data.session?r.data.session.user:null;ready=true;render();if(tab==="mine"&&user)loadMine()}).catch(()=>{ready=true;render()});
addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(["home","pub","mine"].indexOf(t)>=0&&t!==tab)go(t)});
setTimeout(()=>{const e=$("#sp");if(e)e.remove()},2400);
sb.auth.onAuthStateChange((_e,s)=>{user=s?s.user:null});
</script>
